<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Kalou Factorielle</h1>
    <label for="number">Entre un nombre</label>
    <input name="number" id="number" type="number" placeholder="Entre un nombre !">
    <button type="button">Ca fait combien ??</button>
    <h2></h2>
</body>
<script>
    const input = document.querySelector("input")
    const btn = document.querySelector("button")
    const result = document.querySelector("h2")

    function factorial(n) {
        if (n === 1) return 1
        return n * factorial(n - 1)
    }

    btn.addEventListener("click", () => {
        const value = input.value.trim()

        if (value === "" || !Number.isInteger(Number(value))) {
            result.textContent = "Entre un nombre entier valide !"
            result.classList.add("error")
            return
        }

        const n = Number(value)

        if (n < 1) {
            result.textContent = "Le nombre doit être ≥ 1 !"
            result.classList.add("error")
            return
        }

        result.classList.remove("error")
        result.textContent = factorial(n)
    })
</script>

<style>
    /* CSS RESET */
    *,
    *::before,
    *::after {
        box-sizing: border-box;
    }

    * {
        margin: 0;
        padding: 0;
        font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
    }

    @media (prefers-reduced-motion: no-preference) {
        html {
            interpolate-size: allow-keywords;
        }
    }

    body {
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
    }

    img,
    picture,
    video,
    canvas,
    svg {
        display: block;
        max-width: 100%;
    }

    input,
    button,
    textarea,
    select {
        font: inherit;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        overflow-wrap: break-word;
    }

    p {
        text-wrap: pretty;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        text-wrap: balance;
    }

    #root,
    #__next {
        isolation: isolate;
    }

    a {
        text-decoration: none;
    }

    /* END CSS RESET */

    body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    body>* {
        padding: 2px;
        margin: 4px;
    }

    button {
        cursor: pointer;
    }

    .error {
        color: red;
        font-style: italic;
        font-weight: 300;
    }
</style>

</html>
